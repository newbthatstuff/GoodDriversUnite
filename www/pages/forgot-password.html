<div class="page no-toolbar" data-name="forgot-password">
  <div class="navbar">
    <div class="navbar-inner sliding">
      <div class="left">
        <a href="#" class="link back">
          <i class="icon icon-back"></i>
          <span class="ios-only">Back</span>
        </a>
      </div>
      <div>Forgot Password</div>
    </div>
  </div>
  <div class="page-content login-screen-content login-form-box">
    <form class="block" action="Javascript:void(0)" method="post" accept-charset="utf-8" role="form" id="forgotPasswordForm">
      <div class="list">
        <ul>
          <li>
            <div class="item-content item-input">
              <div class="item-inner">
                <div class="item-title item-label">E-mail</div>
                <div class="item-input-wrap">
                  <input type="email" name="email" placeholder="Your E-mail" id="email" required validate>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
      <div class="block">
        <div class="row">
          <div class="col-100">
            <button class="col button button-big button-fill button-raised" type="submit" id="submitForgotPasswordForm">Reset Password</button>
          </div>
        </div>
      </div>
    </form>
  </div>
