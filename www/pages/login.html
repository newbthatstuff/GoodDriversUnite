<div class="page" data-name="login">
  <div class="navbar">
    <div class="navbar-inner sliding">
      <div class="left">
        <a href="#" class="link back">
          <i class="icon icon-back"></i>
          <span class="ios-only">Back</span>
        </a>
      </div>
      <div>Log In</div>
    </div>
  </div>
  <div class="page-content login-screen-content login-form-box">
    <form class="block" action="Javascript:void(0)" method="post" accept-charset="utf-8" role="form" id="loginForm">
      <div class="list">
        <ul>
          <li>
            <div class="item-content item-input">
              <div class="item-inner">
                <div class="item-title item-label">E-mail</div>
                <div class="item-input-wrap">
                  <input class="lowerC" type="email" name="username" placeholder="Your E-mail" id="username" required validate>
                </div>
              </div>
            </div>
          </li>
          <li>
            <div class="item-content item-input">
              <div class="item-inner">
                <div class="item-title item-label">Password</div>
                <div class="item-input-wrap">
                  <input type="password" name="password" placeholder="Password" id="password" required validate>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
      <div class="block">
        <div class="row">
          <div class="col-100">
            <button class="col button button-big button-fill button-raised" type="submit" id="submitLoginForm">Log
              in</button>
          </div>
        </div>
        <div class="row">
          <p class="col-50 text-align-center">
            <a class="link" href="/forgot-password/">Forgot password</a>
          </p>
          <p class="col-50 text-align-center">
            <a class="link" href="/signup/">Create Account</a>
          </p>
        </div>
      </div>
    </form>
  </div>
